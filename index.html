<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RiverBank Big Sauna Temperature</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .logo {
      text-align: center;
      margin: 15px 0 5px;
    }

    .logo img {
      max-width: 300px;
      width: 80%;
      height: auto;
    }

    h2 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 22px;
    }

    .controls {
      width: 92%;
      max-width: 500px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls input[type="range"] {
      flex: 1;
    }

    #rangeLabel {
      font-size: 14px;
      min-width: 60px;
      text-align: right;
      color: #333;
    }

    .chart-container {
      position: relative;
      width: 92%;
      height: 400px;
      margin: 0 auto;
    }

    .status {
      text-align: center;
      margin: 10px 0;
      font-size: 13px;
      color: #666;
    }

    .disclaimer {
      width: 90%;
      margin: 15px auto;
      text-align: center;
      font-size: 9px;
      color: #666;
    }

    @media (max-width: 600px) {
      .chart-container {
        width: 96%;
        height: 350px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="logo">
    <img
      src="https://www.canoecentre.ie/cdn/shop/files/canoe-centre-logo-paddle-spiral.png?v=1770888211&width=300"
      alt="Canoe Centre Logo"
    >
  </div>

  <h2>River and Air Temperature @ Canoe Centre</h2>

  <div class="controls">
    <input
      type="range"
      id="daysSlider"
      min="1"
      max="20"
      step="1"
      value="20"
      aria-label="Number of days to show"
    >
    <span id="rangeLabel">20 days</span>
  </div>

  <div class="chart-container">
    <canvas id="temperatureChart"></canvas>
  </div>

  <div id="status" class="status">
    Loading temperature data...
  </div>

  <div class="disclaimer">
    <p>
      <i>
        Data shown is for informational purposes only and may not be
        accurate or up to date.
      </i>
    </p>

    <p>
      <i>
        Data is provided in good faith but should not be relied upon
        as the sole source of information.
      </i>
    </p>
  </div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const channelID = 3516759;
  const readAPIKey = "6J2896HIFUXK1WIN";

  const field1 = 1;
  const field2 = 2;

  // Number of ThingSpeak records to request
  const results = 5000;

  // Refresh every 5 minutes
  const refreshInterval = 5 * 60 * 1000;

  // Default and maximum window (days)
  const maxDays = 20;
  let daysToShow = 20;


  // ============================================================
  // STATE
  // ============================================================

  let temperatureChart = null;
  let allReadings = [];       // everything fetched, oldest -> newest

  const slider = document.getElementById("daysSlider");
  const rangeLabel = document.getElementById("rangeLabel");


  // ============================================================
  // GET DATA (network)
  // ============================================================

  async function loadData() {

    const status = document.getElementById("status");

    status.textContent = "Loading temperature data...";

    const url =
      `https://api.thingspeak.com/channels/${channelID}/feeds.json` +
      `?api_key=${readAPIKey}` +
      `&results=${results}`;

    try {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      if (!data.feeds || data.feeds.length === 0) {
        status.textContent = "No temperature data available.";
        return;
      }

      const toNumber = value =>
        value === null || value === undefined || value === ""
          ? null
          : Number(value);

      allReadings =
        data.feeds
          .map(entry => ({
            date: new Date(entry.created_at),
            temperature1: toNumber(entry[`field${field1}`]),
            temperature2: toNumber(entry[`field${field2}`])
          }))
          .filter(reading => !isNaN(reading.date.getTime()))
          .sort((a, b) => a.date - b.date);

      renderChart();

      const latestReading = allReadings[allReadings.length - 1];

      if (latestReading) {

        const time =
          latestReading.date.toLocaleString(
            [],
            { dateStyle: "short", timeStyle: "short" }
          );

        status.textContent = `Last data received: ${time}`;
      }

    }

    catch (error) {

      console.error("Unable to load ThingSpeak data:", error);

      status.textContent = "Unable to load temperature data.";

    }

  }


  // ============================================================
  // RENDER (no network - used by refresh and slider)
  // ============================================================

  function renderChart() {

    const now = new Date();

    const cutoff = new Date(now);
    cutoff.setTime(now.getTime() - daysToShow * 24 * 60 * 60 * 1000);

    const recent =
      allReadings.filter(reading => reading.date >= cutoff);

    const build = key =>
      recent
        .filter(r => r[key] !== null && !isNaN(r[key]))
        .map(r => ({ x: r.date, y: r[key] }));

    updateChart(build("temperature1"), build("temperature2"), cutoff, now);

  }


  // ============================================================
  // CREATE CHART
  // ============================================================

  function createChart(data1, data2) {

    const ctx =
      document.getElementById("temperatureChart").getContext("2d");

    temperatureChart =
      new Chart(ctx, {

        type: "line",

        data: {
          datasets: [
            {
              label: "River Temperature",
              data: data1,
              borderColor: "blue",
              borderWidth: 2,
              backgroundColor: "transparent",
              pointRadius: 0,
              pointHoverRadius: 5,
              tension: 0.15,
              fill: false
            },
            {
              label: "Air Temperature",
              data: data2,
              borderColor: "red",
              borderWidth: 2,
              backgroundColor: "transparent",
              pointRadius: 0,
              pointHoverRadius: 5,
              tension: 0.15,
              fill: false
            }
          ]
        },

        options: {

          responsive: true,
          maintainAspectRatio: false,
          animation: false,

          interaction: {
            mode: "nearest",
            intersect: false
          },

          scales: {

            x: {
              type: "time",
              time: {
                unit: "day",
                tooltipFormat: "dd/MM/yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "dd MMM"
                }
              },
              title: {
                display: true,
                text: "Date"
              },
              ticks: {
                maxTicksLimit: 7
              }
            },

            y: {
              min: 0,
              title: {
                display: true,
                text: "Temperature (°C)"
              },
              ticks: {
                callback: function(value) {
                  return value + " °C";
                }
              }
            }

          },

          plugins: {

            legend: {
              display: true,
              position: "top"
            },

            tooltip: {
              enabled: true,
              callbacks: {
                label: function(context) {
                  return (
                    context.dataset.label +
                    ": " +
                    context.parsed.y +
                    " °C"
                  );
                }
              }
            }

          }

        }

      });

  }


  // ============================================================
  // UPDATE CHART
  // ============================================================

  function updateChart(data1, data2, minDate, maxDate) {

    if (!temperatureChart) {
      createChart(data1, data2);
    }

    temperatureChart.data.datasets[0].data = data1;
    temperatureChart.data.datasets[1].data = data2;

    const xScale = temperatureChart.options.scales.x;

    // Fixed rolling window ending now
    xScale.min = minDate;
    xScale.max = maxDate;

    // Hourly ticks for short windows, daily for long ones
    xScale.time.unit = daysToShow <= 2 ? "hour" : "day";

    temperatureChart.update("none");

  }


  // ============================================================
  // SLIDER
  // ============================================================

  function setDays(days) {

    daysToShow = Math.min(maxDays, Math.max(1, Number(days)));

    rangeLabel.textContent =
      daysToShow === 1 ? "1 day" : `${daysToShow} days`;

    if (allReadings.length > 0) {
      renderChart();
    }

  }

  slider.addEventListener("input", () => setDays(slider.value));


  // ============================================================
  // INITIAL LOAD + AUTOMATIC REFRESH
  // ============================================================

  setDays(daysToShow);

  loadData();

  setInterval(loadData, refreshInterval);

</script>

</body>
</html>
