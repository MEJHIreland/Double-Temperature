<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RiverBank Big Sauna Temperature</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .logo {
      text-align: center;
      margin: 15px 0 5px;
    }

    .logo img {
      max-width: 300px;
      width: 80%;
      height: auto;
    }

    h2 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 22px;
    }

    /* ---------- Range slider (two handles) ---------- */

    .controls {
      width: 92%;
      max-width: 500px;
      margin: 0 auto 15px;
      text-align: center;
    }

    #rangeLabel {
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
    }

    .range-wrap {
      position: relative;
      height: 30px;
    }

    .range-track,
    .range-fill {
      position: absolute;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      border-radius: 2px;
    }

    .range-track {
      left: 0;
      right: 0;
      background: #ddd;
    }

    .range-fill {
      background: #1a6fc9;
    }

    .range-wrap input[type="range"] {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 30px;
      margin: 0;
      transform: translateY(-50%);
      background: transparent;
      pointer-events: none;           /* only the thumbs are clickable */
      -webkit-appearance: none;
      appearance: none;
    }

    .range-wrap input[type="range"]::-webkit-slider-runnable-track {
      background: transparent;
      height: 30px;
    }

    .range-wrap input[type="range"]::-moz-range-track {
      background: transparent;
      height: 30px;
    }

    .range-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: 18px;
      height: 18px;
      margin-top: 6px;
      border-radius: 50%;
      background: #1a6fc9;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .range-wrap input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1a6fc9;
      border: 2px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    /* ---------- Chart ---------- */

    .chart-container {
      position: relative;
      width: 92%;
      height: 400px;
      margin: 0 auto;
    }

    .status {
      text-align: center;
      margin: 10px 0;
      font-size: 13px;
      color: #666;
    }

    .disclaimer {
      width: 90%;
      margin: 15px auto;
      text-align: center;
      font-size: 9px;
      color: #666;
    }

    @media (max-width: 600px) {
      .chart-container {
        width: 96%;
        height: 350px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="logo">
    <img
      src="https://www.canoecentre.ie/cdn/shop/files/canoe-centre-logo-paddle-spiral.png?v=1770888211&width=300"
      alt="Canoe Centre Logo"
    >
  </div>

  <h2>River and Air Temperature @ Canoe Centre</h2>

  <div class="controls">
    <div id="rangeLabel">20 days ago → now</div>

    <div class="range-wrap">
      <div class="range-track"></div>
      <div class="range-fill" id="rangeFill"></div>

      <input
        type="range"
        id="startSlider"
        min="0"
        max="20"
        step="0.25"
        value="0"
        aria-label="Start of the period shown"
      >
      <input
        type="range"
        id="endSlider"
        min="0"
        max="20"
        step="0.25"
        value="20"
        aria-label="End of the period shown"
      >
    </div>
  </div>

  <div class="chart-container">
    <canvas id="temperatureChart"></canvas>
  </div>

  <div id="status" class="status">
    Loading temperature data...
  </div>

  <div class="disclaimer">
    <p>
      <i>
        Data shown is for informational purposes only and may not be
        accurate or up to date.
      </i>
    </p>

    <p>
      <i>
        Data is provided in good faith but should not be relied upon
        as the sole source of information.
      </i>
    </p>
  </div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const channelID = 3516759;
  const readAPIKey = "6J2896HIFUXK1WIN";

  const field1 = 1;
  const field2 = 2;

  // Number of ThingSpeak records to request
  const results = 5000;

  // Refresh every 5 minutes
  const refreshInterval = 5 * 60 * 1000;

  // Total history the slider covers (days)
  const maxDays = 20;

  // Smallest window the handles can be squeezed to (days).
  // 0.25 = 6 hours. Use 1 for a one-day minimum.
  const minGap = 0.25;

  const DAY_MS = 24 * 60 * 60 * 1000;


  // ============================================================
  // STATE
  // ============================================================

  let temperatureChart = null;
  let allReadings = [];       // everything fetched, oldest -> newest

  // Slider positions are "days from the start of the 20-day window":
  //   0  = 20 days ago      20 = now
  let rangeStart = 0;
  let rangeEnd = maxDays;

  const startSlider = document.getElementById("startSlider");
  const endSlider = document.getElementById("endSlider");
  const rangeLabel = document.getElementById("rangeLabel");
  const rangeFill = document.getElementById("rangeFill");


  // ============================================================
  // GET DATA (network)
  // ============================================================

  async function loadData() {

    const status = document.getElementById("status");

    status.textContent = "Loading temperature data...";

    const url =
      `https://api.thingspeak.com/channels/${channelID}/feeds.json` +
      `?api_key=${readAPIKey}` +
      `&results=${results}`;

    try {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      if (!data.feeds || data.feeds.length === 0) {
        status.textContent = "No temperature data available.";
        return;
      }

      const toNumber = value =>
        value === null || value === undefined || value === ""
          ? null
          : Number(value);

      allReadings =
        data.feeds
          .map(entry => ({
            date: new Date(entry.created_at),
            temperature1: toNumber(entry[`field${field1}`]),
            temperature2: toNumber(entry[`field${field2}`])
          }))
          .filter(reading => !isNaN(reading.date.getTime()))
          .sort((a, b) => a.date - b.date);

      renderChart();

      const latestReading = allReadings[allReadings.length - 1];

      if (latestReading) {

        const time =
          latestReading.date.toLocaleString(
            [],
            { dateStyle: "short", timeStyle: "short" }
          );

        status.textContent = `Last data received: ${time}`;
      }

    }

    catch (error) {

      console.error("Unable to load ThingSpeak data:", error);

      status.textContent = "Unable to load temperature data.";

    }

  }


  // ============================================================
  // RENDER (no network - used by refresh and slider)
  // ============================================================

  function renderChart() {

    const now = Date.now();

    // Convert slider positions to real dates
    const windowStart = new Date(now - (maxDays - rangeStart) * DAY_MS);
    const windowEnd = new Date(now - (maxDays - rangeEnd) * DAY_MS);

    const recent =
      allReadings.filter(reading =>
        reading.date >= windowStart && reading.date <= windowEnd
      );

    const build = key =>
      recent
        .filter(r => r[key] !== null && !isNaN(r[key]))
        .map(r => ({ x: r.date, y: r[key] }));

    updateChart(
      build("temperature1"),
      build("temperature2"),
      windowStart,
      windowEnd
    );

  }


  // ============================================================
  // CREATE CHART
  // ============================================================

  function createChart(data1, data2) {

    const ctx =
      document.getElementById("temperatureChart").getContext("2d");

    temperatureChart =
      new Chart(ctx, {

        type: "line",

        data: {
          datasets: [
            {
              label: "River Temperature",
              data: data1,
              borderColor: "blue",
              borderWidth: 2,
              backgroundColor: "transparent",
              pointRadius: 0,
              pointHoverRadius: 5,
              tension: 0.15,
              fill: false
            },
            {
              label: "Air Temperature",
              data: data2,
              borderColor: "red",
              borderWidth: 2,
              backgroundColor: "transparent",
              pointRadius: 0,
              pointHoverRadius: 5,
              tension: 0.15,
              fill: false
            }
          ]
        },

        options: {

          responsive: true,
          maintainAspectRatio: false,
          animation: false,

          interaction: {
            mode: "nearest",
            intersect: false
          },

          scales: {

            x: {
              type: "time",
              time: {
                unit: "day",
                tooltipFormat: "dd/MM/yyyy HH:mm",
                displayFormats: {
                  hour: "HH:mm",
                  day: "dd MMM"
                }
              },
              title: {
                display: true,
                text: "Date"
              },
              ticks: {
                maxTicksLimit: 7
              }
            },

            y: {
              min: 0,
              title: {
                display: true,
                text: "Temperature (°C)"
              },
              ticks: {
                callback: function(value) {
                  return value + " °C";
                }
              }
            }

          },

          plugins: {

            legend: {
              display: true,
              position: "top"
            },

            tooltip: {
              enabled: true,
              callbacks: {
                label: function(context) {
                  return (
                    context.dataset.label +
                    ": " +
                    context.parsed.y +
                    " °C"
                  );
                }
              }
            }

          }

        }

      });

  }


  // ============================================================
  // UPDATE CHART
  // ============================================================

  function updateChart(data1, data2, minDate, maxDate) {

    if (!temperatureChart) {
      createChart(data1, data2);
    }

    temperatureChart.data.datasets[0].data = data1;
    temperatureChart.data.datasets[1].data = data2;

    const xScale = temperatureChart.options.scales.x;

    xScale.min = minDate;
    xScale.max = maxDate;

    // Hourly ticks for short windows, daily for long ones
    const windowDays = (maxDate - minDate) / DAY_MS;
    xScale.time.unit = windowDays <= 2 ? "hour" : "day";

    temperatureChart.update("none");

  }


  // ============================================================
  // RANGE SLIDER
  // ============================================================

  // 5 -> "5 days", 0.25 -> "6 hours", 1.5 -> "1 day 12 hours"
  function formatDuration(days) {

    const totalHours = Math.round(days * 24);
    const d = Math.floor(totalHours / 24);
    const h = totalHours % 24;

    const parts = [];

    if (d > 0) parts.push(d + (d === 1 ? " day" : " days"));
    if (h > 0) parts.push(h + (h === 1 ? " hour" : " hours"));

    return parts.join(" ");

  }

  function updateSliderUI() {

    // Label, e.g. "12 days ago → 11 days ago"
    const startAgo = maxDays - rangeStart;
    const endAgo = maxDays - rangeEnd;

    const startText = formatDuration(startAgo) + " ago";
    const endText = endAgo === 0 ? "now" : formatDuration(endAgo) + " ago";

    rangeLabel.textContent = `${startText} → ${endText}`;

    // Blue bar between the two handles
    // (small px offset keeps the bar centred under the thumbs)
    const p1 = (rangeStart / maxDays) * 100;
    const p2 = (rangeEnd / maxDays) * 100;

    rangeFill.style.left =
      `calc(${p1}% + ${(0.5 - p1 / 100) * 18}px)`;

    rangeFill.style.width =
      `calc(${p2 - p1}% + ${((p1 - p2) / 100) * 18}px)`;

  }

  function onSliderInput(changed) {

    let s = Number(startSlider.value);
    let e = Number(endSlider.value);

    // Keep the handles from crossing each other
    if (changed === "start" && s > e - minGap) {
      s = e - minGap;
    }

    if (changed === "end" && e < s + minGap) {
      e = s + minGap;
    }

    s = Math.max(0, s);
    e = Math.min(maxDays, e);
