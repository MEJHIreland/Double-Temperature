<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RiverBank Big Sauna Temperature</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .logo {
      text-align: center;
      margin: 15px 0 5px;
    }

    .logo img {
      max-width: 300px;
      width: 80%;
      height: auto;
    }

    h2 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 22px;
    }

    .chart-container {
      position: relative;
      width: 92%;
      height: 400px;
      margin: 0 auto;
    }

    .status {
      text-align: center;
      margin: 10px 0;
      font-size: 13px;
      color: #666;
    }

    .disclaimer {
      width: 90%;
      margin: 15px auto;
      text-align: center;
      font-size: 9px;
      color: #666;
    }

    @media (max-width: 600px) {
      .chart-container {
        width: 96%;
        height: 350px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="logo">
    <img
      src="https://www.canoecentre.ie/cdn/shop/files/canoe-centre-logo-paddle-spiral.png?v=1770888211&width=300"
      alt="Canoe Centre Logo"
    >
  </div>

  <h2>River and Air Temperature @ Canoe Centre</h2>

  <div class="chart-container">
    <canvas id="temperatureChart"></canvas>
  </div>

  <div id="status" class="status">
    Loading temperature data...
  </div>

  <div class="disclaimer">
    <p>
      <i>
        Data shown is for informational purposes only and may not be
        accurate or up to date.
      </i>
    </p>

    <p>
      <i>
        Data is provided in good faith but should not be relied upon
        as the sole source of information.
      </i>
    </p>
  </div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const channelID = 3516759;
  const readAPIKey = "6J2896HIFUXK1WIN";

  const field1 = 1;
  const field2 = 2;

  // Number of ThingSpeak records to request
  const results = 5000;

  // Refresh every 5 minutes
  const refreshInterval = 5 * 60 * 1000;

  // Show the last 20 days
  const daysToShow = 20;


  // ============================================================
  // CHART
  // ============================================================

  let temperatureChart = null;


  // ============================================================
  // GET DATA
  // ============================================================

  async function loadData() {

    const status =
      document.getElementById("status");

    status.textContent =
      "Loading temperature data...";


    const url =
      `https://api.thingspeak.com/channels/${channelID}/feeds.json` +
      `?api_key=${readAPIKey}` +
      `&results=${results}`;


    try {

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }


      const data =
        await response.json();


      if (!data.feeds || data.feeds.length === 0) {

        status.textContent =
          "No temperature data available.";

        return;
      }


      // --------------------------------------------------------
      // Convert ThingSpeak data
      // --------------------------------------------------------

      const readings =
        data.feeds
          .map(entry => {

            const date =
              new Date(entry.created_at);


            const value1 =
              entry[`field${field1}`];

            const value2 =
              entry[`field${field2}`];


            return {

              date,

              temperature1:
                value1 === null ||
                value1 === undefined ||
                value1 === ""
                  ? null
                  : Number(value1),

              temperature2:
                value2 === null ||
                value2 === undefined ||
                value2 === ""
                  ? null
                  : Number(value2)

            };

          })


          // Remove invalid dates

          .filter(reading =>
            !isNaN(reading.date.getTime())
          )


          // Sort oldest → newest

          .sort((a, b) =>
            a.date - b.date
          );


      // --------------------------------------------------------
      // Only show the last X days
      // --------------------------------------------------------

      const cutoff =
        new Date();

      cutoff.setDate(
        cutoff.getDate() - daysToShow
      );


      const recentReadings =
        readings.filter(reading =>
          reading.date >= cutoff
        );


      // --------------------------------------------------------
      // Field 1
      // --------------------------------------------------------

      const data1 =
        recentReadings
          .filter(reading =>
            reading.temperature1 !== null &&
            !isNaN(reading.temperature1)
          )
          .map(reading => ({
            x: reading.date,
            y: reading.temperature1
          }));


      // --------------------------------------------------------
      // Field 2
      // --------------------------------------------------------

      const data2 =
        recentReadings
          .filter(reading =>
            reading.temperature2 !== null &&
            !isNaN(reading.temperature2)
          )
          .map(reading => ({
            x: reading.date,
            y: reading.temperature2
          }));


      // --------------------------------------------------------
      // Update chart
      // --------------------------------------------------------

      updateChart(data1, data2);


      // --------------------------------------------------------
      // Status
      // --------------------------------------------------------

      const latestReading =
        readings[readings.length - 1];


      if (latestReading) {

        const time =
          latestReading.date.toLocaleString(
            [],
            {
              dateStyle: "short",
              timeStyle: "short"
            }
          );


        status.textContent =
          `Last data received: ${time}`;
      }

    }

    catch (error) {

      console.error(
        "Unable to load ThingSpeak data:",
        error
      );


      status.textContent =
        "Unable to load temperature data.";

    }

  }


  // ============================================================
  // CREATE CHART
  // ============================================================

  function createChart(data1, data2) {

    const canvas =
      document.getElementById(
        "temperatureChart"
      );


    const ctx =
      canvas.getContext("2d");


    temperatureChart =
      new Chart(ctx, {

        type: "line",


        data: {

          datasets: [

            {
              label: "River Temperature",

              data: data1,

              borderColor: "blue",

              borderWidth: 2,

              backgroundColor: "transparent",

              pointRadius: 0,

              pointHoverRadius: 5,

              tension: 0.15,

              fill: false
            },


            {
              label: "Air Temperature",

              data: data2,

              borderColor: "red",

              borderWidth: 2,

              backgroundColor: "transparent",

              pointRadius: 0,

              pointHoverRadius: 5,

              tension: 0.15,

              fill: false
            }

          ]

        },


        options: {

          responsive: true,

          maintainAspectRatio: false,

          animation: false,


          interaction: {

            mode: "nearest",

            intersect: false

          },


          scales: {

            x: {

              type: "time",

              time: {

                unit: "day",

                tooltipFormat:
                  "dd/MM/yyyy HH:mm",

                displayFormats: {

                  day: "dd MMM"

                }

              },

              title: {

                display: true,

                text: "Date"

              },

              ticks: {

                maxTicksLimit: 7

              }

            },


            y: {
            min: 0,
              title: {

                display: true,

                text: "Temperature (°C)"

              },

              ticks: {

                callback: function(value) {

                  return value + " °C";

                }

              }

            }

          },


          plugins: {

            legend: {

              display: true,

              position: "top"

            },


            tooltip: {

              enabled: true,

              callbacks: {

                label: function(context) {

                  return (
                    context.dataset.label +
                    ": " +
                    context.parsed.y +
                    " °C"
                  );

                }

              }

            }

          }

        }

      });

  }


  // ============================================================
  // UPDATE CHART
  // ============================================================

  function updateChart(data1, data2) {

    if (!temperatureChart) {

      createChart(
        data1,
        data2
      );

      return;
    }


    temperatureChart.data.datasets[0].data =
      data1;


    temperatureChart.data.datasets[1].data =
      data2;


    // Recalculate the rolling 20-day window
    const now =
      new Date();


    const minDate =
      new Date(now);

    minDate.setDate(
      minDate.getDate() - daysToShow
    );


    temperatureChart.options.scales.x.min =
      minDate;


    temperatureChart.options.scales.x.max =
      now;


    temperatureChart.update("none");

  }


  // ============================================================
  // INITIAL LOAD
  // ============================================================

  loadData();


  // ============================================================
  // AUTOMATIC REFRESH
  // ============================================================

  setInterval(
    loadData,
    refreshInterval
  );

</script>

</body>
</html>
